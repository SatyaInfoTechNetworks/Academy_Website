version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: academy-db-prod
    restart: always
    environment:
      # This password will be set when the new volume is created
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Qwert123}
      MYSQL_DATABASE: academy_db
    volumes:
      # CHANGING VOLUME NAME FORCES A FRESH DATABASE
      - mysql_data_final:/var/lib/mysql
    networks:
      - academy-net-prod

  backend:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    container_name: academy-backend-prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Connection details
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/academy_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Qwert123}
      
      # Security & Config
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://academy.satyainfotechnetworks.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      - db
    networks:
      - academy-net-prod

networks:
  academy-net-prod:
    driver: bridge

volumes:
  mysql_data_final:
